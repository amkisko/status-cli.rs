[package]
name = "status"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Status page CLI — search catalog and check live status"

[lib]
name = "status"
path = "src/lib.rs"

[[bin]]
name = "status"
path = "src/main.rs"

[features]
default = ["html", "watch"]
html = ["status_lib/html"]
watch = ["dep:ratatui"]

[dependencies]
status_lib = { path = "../status_lib", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "underline-color", "layout-cache"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
