# Flatpak manifest (build with: flatpak-builder build io.github.amkisko.status-cli.yml --force-clean)
app-id: io.github.amkisko.status-cli
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: status
finish-args:
  - --share=network
  - --socket=network
  - --filesystem=home
modules:
  - name: status-cli
    buildsystem: simple
    build-commands:
      - cargo install --path status --root /app
      - install -Dm755 /app/bin/status /app/bin/status
    sources:
      - type: git
        url: https://github.com/amkisko/status-cli.rs
        tag: v0.1.0
        commit: ""  # set for reproducible build
